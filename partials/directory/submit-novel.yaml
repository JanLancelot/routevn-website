- $if directory.forms.submitNovelUrl:
    - rtgl-text s=sm:
        - a href="${directory.forms.submitNovelUrl}" target=_blank rel="noopener noreferrer": ${directory.copy.submitNovel}
  $else:
    - rtgl-view g=xs:
        - rtgl-button v=ol disabled: ${directory.copy.submitNovel}
        - rtgl-text s=xs c=mu-fg: ${directory.copy.formComingSoon}
